name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Snapshot smoke test (no ROS)
        run: python -m tui_img_view -t fake --snapshot -b /detector/detections > /dev/null
      - name: Demo bag smoke test (no ROS)
        run: python -m tui_img_view -t bag -o path=demo/bags/tui_demo -b /detector/detections --snapshot > /dev/null

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,bag]"
      - name: Build docs (strict)
        run: mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: slim
          tags: tui_img_view:slim
          load: true
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max
      - name: Smoke test slim image
        run: |
          docker run --rm tui_img_view:slim -t fake --snapshot -b /detector/detections > /dev/null
          docker run --rm tui_img_view:slim -t bag -o path=/app/demo/bags/tui_demo -b /detector/detections --snapshot > /dev/null
          docker run --rm tui_img_view:slim --version
      - name: Build ros2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          target: ros2
          tags: tui_img_view:ros2
          load: true
          cache-from: type=gha,scope=ros2
          cache-to: type=gha,scope=ros2,mode=max
      - name: Smoke test ros2 image
        run: |
          docker run --rm tui_img_view:ros2 python3 -c "import rclpy, tui_img_view.transports.ros2; rclpy.init(); rclpy.shutdown(); print('rclpy ok')"
          docker run --rm tui_img_view:ros2 -t bag -o path=/app/demo/bags/tui_demo -b /detector/detections --snapshot > /dev/null
          docker run --rm tui_img_view:ros2 ros2 bag info /app/demo/bags/tui_demo
      - name: Validate compose file
        run: docker compose -f .docker/docker-compose.yml config --quiet
