site_name: tui_img_view
site_description: View image topics and bounding boxes in the terminal. ROS 2 first, any transport by design.
site_url: https://guilyx.github.io/tui_img_view_ros2/
repo_url: https://github.com/guilyx/tui_img_view_ros2
repo_name: guilyx/tui_img_view_ros2
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Erwin Lejeune &middot; MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Usage: usage.md
      - Demo bag: demo.md
  - Guides:
      - ROS 2 transport: ros2.md
      - Custom box message types: custom-box-types.md
      - Writing a transport: transports.md
  - Reference:
      - Architecture: architecture.md
      - Python API: api.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - License: license.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
